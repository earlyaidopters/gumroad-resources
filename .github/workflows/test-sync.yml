name: test-sync
on:
  pull_request:
    paths: ['tools/**', '.github/workflows/**']
  push:
    paths: ['tools/**', '.github/workflows/**']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/tests -v
      - run: bash -n tools/sync.sh
