name: sync-gumroad

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours; change to "0 */3 * * *" for every 3h
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-gumroad
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A YouTube Data API key reads public uploads and their descriptions,
      # which is everything the pairing needs. It cannot touch the channel:
      # the API refuses key auth for every write. Failing here must never stop
      # the sync, and youtube_map.py preserves any pairing it cannot reproduce
      # (CI has no Skool cookie), so a bad run leaves the map as it was.
      - name: Refresh YouTube pairings
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "No YOUTUBE_API_KEY set, leaving tools/youtube_map.json untouched."
            exit 0
          fi
          pip install --quiet google-api-python-client
          python3 tools/youtube_map.py

      - name: Sync from Gumroad
        id: sync
        continue-on-error: true
        env:
          GUMROAD_COOKIE: ${{ secrets.GUMROAD_COOKIE }}
        run: bash tools/sync.sh

      - name: Flag expired cookie
        if: steps.sync.outcome == 'failure' && hashFiles(format('{0}/auth_failed', runner.temp)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Gumroad session cookie expired — sync paused"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title" --body \
              "The scheduled Gumroad sync could not authenticate. The session cookie in the \`GUMROAD_COOKIE\` secret has expired. Refresh it (see \`tools/README.md\`) and update the secret. New resources will not appear until this is fixed."
          fi
          exit 1

      - name: Fail if sync errored for another reason
        if: steps.sync.outcome == 'failure' && hashFiles(format('{0}/auth_failed', runner.temp)) == ''
        run: |
          echo "sync.sh failed for a non-auth reason; see the Sync step log."
          exit 1

      - name: Commit & push changes
        if: steps.sync.outcome == 'success'
        run: |
          git config user.name "gumroad-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            n=$(git status --porcelain | wc -l | tr -d ' ')
            git commit -m "sync: refresh resources from Gumroad ($(date -u +%Y-%m-%d)) [$n paths]"
            git push
          fi

      - name: Flag drops with no video paired
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=$(python3 tools/check_pairings.py --repo .)
          title="Video pairing missing for the newest drop(s)"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$missing" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "All recent resources are paired with a video again."
            fi
            echo "All recent resources have a video paired."
            exit 0
          fi
          echo "Unpaired: $missing"
          body=$(printf 'These resources are live in the repo with no YouTube video linked, so members see a dash in the Watch column:\n\n%s\n\nCI refreshes the pairing map on every run, so this means the drop is genuinely unpaired: usually the video description has no Gumroad link yet, or the Skool lesson has not been posted. Add the link to the video description and the next sync picks it up. This issue closes itself once every recent drop is paired.' "$missing")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still unpaired: $missing"
          else
            gh issue create --title "$title" --body "$body"
          fi
