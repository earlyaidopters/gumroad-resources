<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 235"><rect width="1000" height="235" rx="20" fill="#f1ece0"/><g font-family="Arial" fill="#272d26"><text x="40" y="43" font-size="15" letter-spacing="2">ONE EVENT. ONE USEFUL RESPONSE.</text><rect x="35" y="73" width="290" height="125" rx="14" fill="#fffdf6"/><text x="53" y="107" font-size="19" font-weight="bold">1 / Claude reads a file</text><text x="53" y="160" font-size="16">An event is sent.</text><rect x="362" y="73" width="290" height="125" rx="14" fill="#fffdf6"/><text x="380" y="107" font-size="19" font-weight="bold">2 / The mod notices</text><text x="380" y="160" font-size="16">Its code updates a count.</text><rect x="689" y="73" width="290" height="125" rx="14" fill="#d9795b"/><text x="707" y="107" font-size="19" font-weight="bold">3 / You see the change</text><text x="707" y="160" font-size="16">The pet reacts on screen.</text></g></svg>