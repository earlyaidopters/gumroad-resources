<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My model</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f3ef;color:#17252a;font:18px system-ui}main{max-width:920px;margin:0 auto;padding:28px 28px 160px;height:100dvh;display:flex;flex-direction:column}#chat{flex:1;min-height:0;overflow:auto}header,form{flex-shrink:0}header{display:flex;gap:20px;align-items:center;justify-content:space-between}h1{font-size:32px}select,button,textarea{font:inherit;padding:12px;border:1px solid #afb8b3;border-radius:10px}button{background:#146b63;color:white;cursor:pointer}button:disabled{opacity:.5}textarea{width:100%;min-height:105px;resize:vertical;background:white}article{white-space:pre-wrap;background:white;border-radius:12px;margin:20px 0;padding:20px;line-height:1.55;overflow-wrap:anywhere}article.user{background:#e2ece7}small{display:block;color:#536168;margin:10px 0}form{margin-top:24px}#status{min-height:24px}@media(max-width:600px){main{padding:16px 16px 20px}header{display:block}h1{font-size:28px}}</style><main><header><h1>My model</h1><select id="model" aria-label="Choose model"><option value="history-q4_k_m">History copy</option><option value="behavior-q4_k_m">Customer copy</option></select><button id="reset" type="button">New chat</button></header><small>Running on Hostinger · Compact copies · Check the answers</small><div id="chat" aria-live="polite"></div><form><label for="prompt">Your message</label><textarea id="prompt" required></textarea><button id="send">Send</button><small id="status" role="status"></small></form></main><script>
let messages=[{role:'system',content:'You are a helpful assistant.'}];const el=id=>document.getElementById(id);const add=(role,text)=>{const a=document.createElement('article');a.className=role;a.textContent=text;el('chat').append(a);a.scrollIntoView({block:"nearest"});return a;};const reset=()=>{messages=[{role:'system',content:'You are a helpful assistant.'}];el('chat').replaceChildren();el('status').textContent='';};el('reset').onclick=reset;el('model').onchange=reset;document.querySelector('form').onsubmit=async e=>{e.preventDefault();const content=el('prompt').value.trim();if(!content)return;messages.push({role:'user',content});add('user',content);el('prompt').value='';el('send').disabled=true;el('model').disabled=true;el('reset').disabled=true;el('status').textContent='Waiting for the server…';let reply;try{const r=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:el('model').value,messages,temperature:0,repeat_penalty:1,max_tokens:500,cache_prompt:false,stream:true})});if(!r.ok)throw Error('Server returned '+r.status);reply=add('assistant','');const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='',text='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let ix;while((ix=buffer.indexOf('\n'))>=0){const line=buffer.slice(0,ix).trim();buffer=buffer.slice(ix+1);if(!line.startsWith('data: ')||line==='data: [DONE]')continue;const event=JSON.parse(line.slice(6));text+=event.choices?.[0]?.delta?.content||'';reply.textContent=text;el('status').textContent='Replying from Hostinger…';}}messages.push({role:'assistant',content:text});el('status').textContent='Reply complete. Read the full answer before using it.';}catch(e){el('status').textContent=e.message+' — start a new chat to retry.';}finally{el('send').disabled=false;el('model').disabled=false;el('reset').disabled=false;}};
</script></html>
