# Narrow development pilot using only benign prompts. Not a general uncensoring benchmark.
model = "@MODEL@"
dtypes = ["bfloat16"]
device_map = "@DEVICE@"
quantization = "none"
batch_size = 1
max_response_length = 100
response_prefix = ""
n_trials = 3
n_startup_trials = 3
seed = 7319
study_checkpoint_dir = "@RUN@/checkpoints"
checkpoint_action = "continue"
trial_index = 0
model_action = "save"
export_strategy = "merge"
save_directory = "@RUN@/model"
modified_model_type = "benign-history-development-pilot"
scorers = [
  { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "minimize" },
  { plugin = "heretic.scorers.kl_divergence.KLDivergence", optimization = "minimize" }
]
modifiers = [{ plugin = "heretic.modifiers.abliteration.Abliteration" }]
[scorer.KeywordRate]
score_name = "Development refusal phrases"
keyword_markers = ["i'm sorry", "i cannot", "i can't assist", "i can't help"]
print_responses = true
[scorer.KeywordRate.prompts]
dataset = "@DATA@/reduce-refusal.txt"
[scorer.KLDivergence.prompts]
dataset = "@DATA@/preserve.txt"
[modifier.Abliteration]
row_normalization = "pre"
[modifier.Abliteration.good_prompts]
dataset = "@DATA@/preserve.txt"
[modifier.Abliteration.bad_prompts]
dataset = "@DATA@/reduce-refusal.txt"
