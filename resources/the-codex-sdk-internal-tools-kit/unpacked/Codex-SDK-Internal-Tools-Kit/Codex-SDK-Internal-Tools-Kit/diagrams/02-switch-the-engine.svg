<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><filter id="s" x="-20%" y="-20%" width="160%" height="160%"><feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#171715"/></filter></defs>
  <rect width="1600" height="900" fill="#f3f0e8"/>
  <text x="90" y="105" fill="#c95f3b" font-family="Arial" font-size="20" font-weight="900" letter-spacing="4">ONE APP · TWO ENGINES</text>
  <text x="90" y="188" fill="#171715" font-family="Arial" font-size="72" font-weight="900" letter-spacing="-4">Swap the backend.</text>
  <text x="90" y="257" fill="#171715" font-family="Arial" font-size="72" font-weight="900" letter-spacing="-4">Keep the product.</text>

  <g transform="translate(90 360)" filter="url(#s)">
    <rect width="410" height="250" rx="34" fill="#fffdf8" stroke="#171715" stroke-width="3"/>
    <text x="42" y="60" fill="#c95f3b" font-family="Arial" font-size="18" font-weight="900" letter-spacing="3">FRIENDLY FRONT</text>
    <text x="42" y="118" fill="#171715" font-family="Arial" font-size="38" font-weight="900">Your internal app</text>
    <rect x="42" y="155" width="324" height="58" rx="29" fill="#c95f3b" stroke="#171715" stroke-width="2"/>
    <text x="204" y="192" text-anchor="middle" fill="#fff" font-family="Arial" font-size="20" font-weight="900">MAKE THE THING →</text>
  </g>

  <path d="M520 485 H690" stroke="#171715" stroke-width="7" stroke-linecap="round"/>
  <circle cx="705" cy="485" r="17" fill="#c95f3b" stroke="#171715" stroke-width="3"/>

  <g transform="translate(700 385)">
    <rect width="210" height="200" rx="105" fill="#efd6cb" stroke="#171715" stroke-width="3"/>
    <text x="105" y="78" text-anchor="middle" fill="#171715" font-family="Arial" font-size="18" font-weight="900" letter-spacing="2">AI BACKEND</text>
    <text x="105" y="124" text-anchor="middle" fill="#171715" font-family="Arial" font-size="36" font-weight="900">SWITCH</text>
    <path d="M67 153 H143" stroke="#171715" stroke-width="6" stroke-linecap="round"/>
    <circle cx="121" cy="153" r="14" fill="#c95f3b" stroke="#171715" stroke-width="3"/>
  </g>

  <path d="M925 485 C1000 485 1000 365 1080 365" stroke="#171715" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M925 485 C1000 485 1000 650 1080 650" stroke="#171715" stroke-width="7" fill="none" stroke-linecap="round"/>

  <g transform="translate(1090 285)" filter="url(#s)">
    <rect width="420" height="210" rx="30" fill="#dce6dc" stroke="#171715" stroke-width="3"/>
    <text x="38" y="52" fill="#45624a" font-family="Arial" font-size="17" font-weight="900" letter-spacing="2">PRIVATE / OWNER-OPERATED</text>
    <text x="38" y="106" fill="#171715" font-family="Arial" font-size="32" font-weight="900">Codex subscription</text>
    <text x="38" y="147" fill="#5e5b54" font-family="Arial" font-size="19">Local sign-in · narrow sandbox</text>
    <text x="38" y="177" fill="#5e5b54" font-family="Arial" font-size="19">Plan limits still apply</text>
  </g>

  <g transform="translate(1090 570)" filter="url(#s)">
    <rect width="420" height="210" rx="30" fill="#fff8df" stroke="#171715" stroke-width="3"/>
    <text x="38" y="52" fill="#8e6713" font-family="Arial" font-size="17" font-weight="900" letter-spacing="2">SHARED / DEPLOYED / PUBLIC</text>
    <text x="38" y="106" fill="#171715" font-family="Arial" font-size="32" font-weight="900">OpenAI API</text>
    <text x="38" y="147" fill="#5e5b54" font-family="Arial" font-size="19">Service key · usage billing</text>
    <text x="38" y="177" fill="#5e5b54" font-family="Arial" font-size="19">Identity, isolation, abuse controls</text>
  </g>

  <text x="90" y="795" fill="#171715" font-family="Arial" font-size="28" font-weight="900">The app calls one interface.</text>
  <text x="90" y="835" fill="#5e5b54" font-family="Arial" font-size="24">Configuration chooses the engine—never a silent paid fallback.</text>
</svg>

