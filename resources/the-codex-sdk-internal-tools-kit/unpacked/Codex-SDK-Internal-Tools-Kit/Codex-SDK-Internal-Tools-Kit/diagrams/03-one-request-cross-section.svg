<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><filter id="s" x="-20%" y="-20%" width="160%" height="160%"><feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#171715"/></filter></defs>
  <rect width="1600" height="900" fill="#f3f0e8"/>
  <text x="90" y="105" fill="#c95f3b" font-family="Arial" font-size="20" font-weight="900" letter-spacing="4">ONE REQUEST, OPENED UP</text>
  <text x="90" y="190" fill="#171715" font-family="Arial" font-size="72" font-weight="900" letter-spacing="-4">What happens after you click?</text>
  <rect x="80" y="290" width="1440" height="430" rx="42" fill="#fffdf8" stroke="#171715" stroke-width="3" filter="url(#s)"/>
  <path d="M200 430 H1390" stroke="#c95f3b" stroke-width="6" stroke-dasharray="22 22"/>
  <g font-family="Arial" text-anchor="middle">
    <g transform="translate(150 375)"><rect width="230" height="260" rx="26" fill="#fff8df" stroke="#171715" stroke-width="2"/><text x="115" y="58" font-size="38">☝</text><text x="115" y="105" font-size="25" font-weight="900">APP</text><text x="115" y="150" font-size="17" fill="#666259">You press one</text><text x="115" y="176" font-size="17" fill="#666259">purpose-built button.</text></g>
    <g transform="translate(420 375)"><rect width="230" height="260" rx="26" fill="#efd6cb" stroke="#171715" stroke-width="2"/><text x="115" y="58" font-size="38">↔</text><text x="115" y="105" font-size="25" font-weight="900">BRIDGE</text><text x="115" y="150" font-size="17" fill="#666259">The server checks</text><text x="115" y="176" font-size="17" fill="#666259">and carries the task.</text></g>
    <g transform="translate(690 375)"><rect width="230" height="260" rx="26" fill="#ffffff" stroke="#171715" stroke-width="2"/><text x="115" y="58" font-size="38">⚙</text><text x="115" y="105" font-size="25" font-weight="900">WORKER</text><text x="115" y="150" font-size="17" fill="#666259">Codex understands</text><text x="115" y="176" font-size="17" fill="#666259">the bounded job.</text></g>
    <g transform="translate(960 375)"><rect width="230" height="260" rx="26" fill="#dce6dc" stroke="#171715" stroke-width="2"/><text x="115" y="58" font-size="38">▤</text><text x="115" y="105" font-size="25" font-weight="900">BOUNDARY</text><text x="115" y="150" font-size="17" fill="#666259">Only allowed files,</text><text x="115" y="176" font-size="17" fill="#666259">tools, and network.</text></g>
    <g transform="translate(1230 375)"><rect width="230" height="260" rx="26" fill="#e6e0ef" stroke="#171715" stroke-width="2"/><text x="115" y="58" font-size="43">✓</text><text x="115" y="105" font-size="25" font-weight="900">RESULT</text><text x="115" y="150" font-size="17" fill="#666259">Validated output</text><text x="115" y="176" font-size="17" fill="#666259">returns to the app.</text></g>
  </g>
  <rect x="300" y="772" width="1000" height="72" rx="20" fill="#171715"/>
  <text x="800" y="817" text-anchor="middle" fill="#fffdf8" font-family="Arial" font-size="23" font-weight="900">Your request never has to become a public chat window.</text>
</svg>

