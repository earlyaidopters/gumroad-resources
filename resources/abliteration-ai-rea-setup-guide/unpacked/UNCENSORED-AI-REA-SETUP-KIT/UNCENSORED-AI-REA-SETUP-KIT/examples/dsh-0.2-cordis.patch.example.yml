# Current 0.2.0-rc.2 route: ~/.dsh/profiles/web/cordis.patch.yml
# Merge into the existing llm-pi-ai entry, preserving its other fields.
# If the UI supplied a different credential reference, preserve that name.
- id: llm-pi-ai
  config:
    providers:
      abliteration:
        displayName: Abliteration AI
        apiKeyEnv: ABLITERATION_API_KEY
        api: openai-completions
        baseURL: https://api.abliteration.ai/v1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: abliterated-model-large
            contextWindow: 1000000
            input: [text]
          - id: abliterated-model-large-v2
            contextWindow: 1000000
            input: [text]
          - id: abliterated-model
            contextWindow: 262144
            input: [text, image]
